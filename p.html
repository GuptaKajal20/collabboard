<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator portfolio · Collab Pro</title>
  <meta name="description" content="A creator portfolio made with Collab Pro.">
  <meta name="robots" content="index, follow, max-image-preview:large" id="robots">
  <link rel="canonical" id="canonical">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Collab Pro">
  <meta property="og:image" content="/assets/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portfolio.css">
  <style>
    body { margin: 0; background: #f7f6f2; min-height: 100vh; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
    /* Without a page background, the white sheet hugs the module column. */
    .sheet:not(.sheet-bg) { max-width: 680px; margin: 0 auto; }
    .sheet:not(.sheet-bg):has(:is(.pb-layout-split, .pb-layout-bento, .pb-layout-poster, .pb-layout-report)) { max-width: 980px; }
    .sheet { background: #fff; border-radius: 24px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 20px 50px -20px rgba(40, 30, 100, 0.2); overflow: hidden; }
    .draft-bar { margin-bottom: 16px; padding: 10px 14px; border-radius: 12px; background: #fdf6e7; color: #7a5a12; font: 14px Inter, system-ui, sans-serif; }
    .foot { margin-top: 18px; text-align: center; font: 13px Inter, system-ui, sans-serif; color: #8a887f; }
    .foot a { color: #5b4bd6; text-decoration: none; font-weight: 600; }
    .foot .made { display: inline-flex; align-items: center; gap: 6px; }
    .foot .made img { border-radius: 5px; }
    .foot .credit, .foot .credit a { font-size: 12px; font-weight: 400; color: #8a887f; }
    .message { padding: 80px 24px; text-align: center; font: 16px Inter, system-ui, sans-serif; color: #6b6a65; }
    .zoom { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(10, 10, 20, 0.85); cursor: zoom-out; }
    .zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    .zoom[hidden] { display: none; }
    /* With a design background, the page fills the window and the white sheet steps aside. */
    body.has-bg { background: transparent; }
    .sheet.sheet-bg { background: transparent; box-shadow: none; overflow: visible; }
    body.has-bg .foot { display: table; margin: 18px auto 0; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="draft-bar" id="draft-bar" hidden>Preview of your draft. Brands see this after you click Publish.</div>
    <main class="sheet" id="sheet"><p class="message">Loading…</p></main>
    <p class="foot"><a href="/" class="made"><img src="/assets/logo-icon.png" alt="" width="18" height="18"> Made with Collab Pro</a> · <a href="/creator-portfolio">Build your free portfolio</a></p>
  </div>
  <div class="zoom" id="zoom" hidden><img alt=""></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/cloud.js"></script>
  <script src="/design.js"></script>
  <script src="/portfolio.js"></script>
  <script>
    // Shows a published portfolio (/p/name) or, with ?draft=1, the creator's own unpublished draft.
    (async function () {
      const sheet = document.getElementById("sheet");
      const params = new URLSearchParams(location.search);
      const slug = (location.pathname.match(/\/p\/([a-z0-9-]+)/) || [])[1] || params.get("u");
      let data = null;

      if (params.has("draft")) {
        try { data = JSON.parse(localStorage.getItem("cb_site")); } catch { data = null; }
        document.getElementById("draft-bar").hidden = !data;
        document.getElementById("robots").content = "noindex, nofollow";
      } else if (slug && window.Cloud.ready) {
        try { data = (await window.Cloud.fetchPublic(slug) || {}).data; } catch { data = null; }
      }

      data = window.Portfolio.migrate(data);
      if (!data || !data.blocks) {
        document.getElementById("robots").content = "noindex, nofollow";
        document.getElementById("canonical").remove();
        sheet.innerHTML = `<p class="message">${slug && !window.Cloud.ready ? "Public portfolios aren't switched on yet." : "This portfolio doesn't exist or isn't public yet."}</p>`;
        return;
      }

      sheet.innerHTML = window.Portfolio.renderPortfolio(data, { fixedBg: true });
      if (data.design && data.design.bg && data.design.bg.type && data.design.bg.type !== "none") {
        document.body.classList.add("has-bg");
        sheet.classList.add("sheet-bg");
      }
      const bgImg = data.design && data.design.bg && data.design.bg.type === "image" && data.design.bg.image;
      const credit = bgImg && window.PortfolioDesign.creditHtml(window.PortfolioDesign.normalize(data.design).bg.image.credit);
      if (credit) document.querySelector(".foot").insertAdjacentHTML("beforeend", `<br><span class="credit">Background: ${credit}</span>`);
      const head = data.blocks.find((b) => b.type === "profile" && b.coverOn && b.coverImg && b.coverCredit);
      const headCredit = head && window.PortfolioDesign.creditHtml(head.coverCredit);
      if (headCredit) document.querySelector(".foot").insertAdjacentHTML("beforeend", `<br><span class="credit">Header image: ${headCredit}</span>`);
      window.Portfolio.enhance(sheet);
      const profile = data.blocks.find((b) => b.type === "profile");
      if (slug && !params.has("draft")) document.getElementById("canonical").href = `${location.origin}/p/${slug}`;
      else document.getElementById("canonical").remove();
      if (profile && profile.name) {
        document.title = `${profile.name} · Creator portfolio | Collab Pro`;
        const bio = String(profile.bio || "").replace(/\s+/g, " ").trim();
        document.querySelector('meta[name="description"]').content = `${profile.name}'s creator portfolio${bio ? `: ${bio}` : ""}`.slice(0, 160);
      }

      // ---------- analytics: opens, visits and module clicks (published link only) ----------
      // A visitor is a random ID kept in their own browser; no names, emails or IP addresses are recorded.
      // The creator's own views (their draft is in this browser) are not counted.
      const own = (() => { try { return (JSON.parse(localStorage.getItem("cb_site")) || {}).slug === slug; } catch { return false; } })();
      if (slug && !params.has("draft") && window.Cloud.ready && !own) {
        const keep = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } return v; };
        const keepSession = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch { return null; } return v; };
        let visitor = keep("cp_vid");
        if (!visitor) visitor = keep("cp_vid", (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, "").slice(0, 32));
        const seenKey = `cp_seen_${slug}`;
        const isNew = !keep(seenKey);
        keep(seenKey, "1");
        const send = (row) => window.Cloud.trackEvent({ slug, visitor, is_new: isNew, ...row });
        send({ kind: "open" });
        // A visit: opens within 30 minutes of each other count once.
        const visitKey = `cp_visit_${slug}`;
        const last = Number(keepSession(visitKey) || 0);
        if (Date.now() - last > 30 * 60 * 1000) send({ kind: "visit" });
        keepSession(visitKey, String(Date.now()));
        // Clicks on a module's links, buttons, photos and previews.
        const lastClick = {};
        sheet.addEventListener("click", (e) => {
          const mod = e.target.closest("[data-mid]");
          if (!mod || !e.target.closest("a, button, [data-pdf], .pb-photo, video")) return;
          const id = mod.dataset.mid;
          if (Date.now() - (lastClick[id] || 0) < 800) return; // one double-click is one click
          lastClick[id] = Date.now();
          keepSession(visitKey, String(Date.now()));
          send({ kind: "click", module_id: id.slice(0, 40), module_type: (mod.dataset.mtype || "").slice(0, 20), label: (mod.dataset.mlabel || "").slice(0, 120) });
        }, true);
      }

      // Tap a photo to see it large.
      const zoom = document.getElementById("zoom");
      sheet.addEventListener("click", (e) => {
        const photo = e.target.closest(".pb-photo");
        if (!photo) return;
        zoom.querySelector("img").src = photo.querySelector("img").src;
        zoom.hidden = false;
      });
      zoom.addEventListener("click", () => { zoom.hidden = true; });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") zoom.hidden = true; });
    })();
  </script>
</body>
</html>
