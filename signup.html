<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem("cp_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Sign up | Collab Pro</title>
  <meta name="description" content="Create your free Collab Pro account.">
  <meta name="robots" content="noindex, nofollow">
  
  <meta name="theme-color" content="#ebe8de" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Collab Pro">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="Sign up | Collab Pro">
  <meta property="og:description" content="Create your free Collab Pro account.">
  <meta property="og:url" content="https://collabboard-blush.vercel.app/signup">
  <meta property="og:image" content="https://collabboard-blush.vercel.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Collab Pro: find brand collabs and build your portfolio, free">
  <meta name="twitter:card" content="summary_large_image">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/site.css">
  
  <script>document.documentElement.classList.add("js");</script>
  <script src="/cp-config.js"></script>
</head>
<body class="auth-page">

<main id="main">
<section class="auth">
  <div class="auth-side">
    <a class="brand" href="/" aria-label="Collab Pro home">
  <img class="brand-logo" src="/assets/logo.png" alt="Collab Pro" width="68" height="56">
</a>
    <img class="auth-photo" src="/assets/photos/moody-600.jpg" srcset="/assets/photos/moody-600.jpg 600w, /assets/photos/moody-1200.jpg 1200w" sizes="50vw" width="1200" height="1600" alt="A creator sitting by a building in soft light" fetchpriority="high" decoding="async">
  <div class="auth-copy"><h2>Find brand collabs.<br><em>Build your portfolio.</em></h2>
  <ul class="ticks"><li><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg> Fresh openings every morning</li><li><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17M9 9v11.5"/></svg> Free drag-and-drop portfolio</li><li><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg> One account on every device</li></ul></div>
  </div>
  <div class="auth-main">
    <div class="auth-top"><a class="back" href="/">← Back to home</a><button type="button" class="theme-btn" data-theme-toggle aria-label="Switch to dark mode" title="Switch light or dark mode">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
</button></div>
    <form class="auth-form" id="signup-form" data-auth="signup" novalidate>
    <h1>Create your free account</h1>
    <p class="muted">Already have one? <a href="/signin" data-swap>Sign in</a></p>
    <div class="field"><label for="su-name">Your name <span class="req">*</span></label><input id="su-name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="su-email">Email <span class="req">*</span></label><input id="su-email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="su-pass">Password <span class="req">*</span></label>
  <div class="pw"><input id="su-pass" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="su-pass-hint"><button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button></div>
  <p class="hint" id="su-pass-hint">At least 8 characters.</p></div>
    <label class="check"><input type="checkbox" name="terms" required> I agree to the <a href="/terms-of-service" target="_blank">Terms</a> and <a href="/privacy-policy" target="_blank">Privacy policy</a></label>
    <p class="form-msg" role="alert" hidden></p>
    <button class="pill pill-lg pill-block" type="submit">Create account</button>
  </form>
  </div>
</section>
</main>

<div class="cursor" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase-config.js"></script>
<script src="/cloud.js"></script>
<script src="/site-auth.js"></script>
<script src="/site.js" defer></script>
<script src="/splash-cursor.js" defer></script>
</body>
</html>
