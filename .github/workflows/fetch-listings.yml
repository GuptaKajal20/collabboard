name: Fetch listings

on:
  schedule:
    - cron: "30 1 * * *" # every day at 7:00 IST
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-listings.mjs
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Save new listings
        run: |
          git config user.name "collabboard-bot"
          git config user.email "collabboard-bot@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Update listings"
          git push
